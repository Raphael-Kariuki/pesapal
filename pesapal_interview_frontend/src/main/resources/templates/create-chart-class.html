<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <title>Chart Class</title>
    <!--    <link th:href="@{/css/output.css}" rel="stylesheet">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

</head>
<body >
<div class="card">

    <div class="card-body">
        <form th:action="@{/chart-class/add}" th:object="${registerChartClassRequest}" method="post" class="max-w-sm mx-auto">
            <div class="mb-3">
                <label for="className" class="form-label">Class name: </label>
                <input id="className" type="text" th:field="*{className}" class="form-control" placeholder="Enter Class name" required />
            </div>
            <div class="mb-3">
                <label for="classCode" class="form-label">Class code: </label>
                <input id="classCode" type="text" th:field="*{classCode}" class="form-control" placeholder="Enter Class code" required />
            </div>
            <div class="mb-3">
                <label for="chartClassType" class="form-label">Class type: </label>
                <select id="chartClassType" th:field="*{chartClassType}" class="form-select">
                    <option th:each="classType : ${classTypes.entrySet()}"
                            th:value="${classType.key}"
                            th:text="${classType.value}"></option>
                </select>
                <!--    <input id="chartClassType" type="text" th:field="*{chartClassType}" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Enter Class type" required />-->
            </div>
            <div class="mb-3">
                <label for="userName" class="form-label">user name: </label>
                <input id="userName" type="text" th:field="*{userName}" class="form-control" placeholder="Enter user name" required />
            </div>
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <a class="text-bg-info p-3 rounded text-center fw-bold text-decoration-none" th:href="@{|/chart-class|}">Back</a>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>
        </form>
    </div>
</div>


</body>
</html>
