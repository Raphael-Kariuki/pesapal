<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="UTF-8">
  <title>Chart Type</title>
  <!--    <link th:href="@{/css/output.css}" rel="stylesheet">-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

</head>
<body >

<div class="card">
  <div class="card-body">

    <form th:action="@{/chart-type/add}" th:object="${registerChartTypesRequest}" method="post" class="max-w-sm mx-auto">
      <div class="mb-3">
        <label for="chartTypeName" class="form-label">Chart Type name: </label>
        <input id="chartTypeName" type="text" th:field="*{chartTypeName}" class="form-control" placeholder="Enter Chart Type name" required />
      </div>
      <div class="mb-3">
        <label for="chartTypeCode" class="form-label">Chart Type code: </label>
        <input id="chartTypeCode" type="text" th:field="*{chartTypeCode}" class="form-control" placeholder="Enter Chart Type code" required />
      </div>
      <div class="mb-3">
        <label for="chartClass" class="form-label">Chart Class name: </label>
        <select class="form-select" id="chartClass" th:field="*{chartClassId}">
          <option th:each="chartClass : ${chartClasses}"
                  th:value="${chartClass.oid}"
                  th:text="${chartClass.className}"></option>
        </select>
      </div>
      <div class="mb-3">
        <label for="parentId" class="form-label">Chart Type Parent name: </label>
        <select class="form-select" id="parentId" th:field="*{parentId}">
          <option th:each="chartType : ${chartTypes}"
                  th:value="${chartType.oid}"
                  th:text="${chartType.chartTypeName}"></option>
        </select>
      </div>
      <div class="mb-3">
        <label for="userName" class="form-label">User name: </label>
        <input id="userName" type="text" th:field="*{userName}" class="form-control" placeholder="Enter user name" required />
      </div>
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <a class="text-bg-info p-3 rounded text-center fw-bold text-decoration-none" th:href="@{|/chart-type|}">Back</a>
      <button type="submit" class="btn btn-success">Submit</button>
      </div>
    </form>

  </div>
</div>


</body>
</html>
