<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
    <meta charset="UTF-8">
    <title>Chart Class</title>
<!--    <link th:href="@{/css/output.css}" rel="stylesheet">-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />

</head>
<body >


<div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
    <table class="table table-stripped">
        <thead class="text-sm text-body bg-neutral-secondary-soft border-b rounded-base border-default">
        <tr>
            <div class="p-3 d-flex justify-content-between align-items-center" >
                <a class="text-bg-info p-3 rounded text-center fw-bold text-decoration-none" th:href="@{/}">Home</a>

                <a class="text-bg-info p-3 rounded text-center fw-bold text-decoration-none" th:href="@{/chart-class/add}">New Chart Class</a>
            </div>
        </tr>
        <tr>
            <th scope="col" class="px-6 py-3 font-bold">
                Class name
            </th>
            <th scope="col" class="px-6 py-3 font-bold">
               Class code
            </th>
            <th scope="col" class="px-6 py-3 font-bold">
               Class type
            </th>
            <th scope="col" class="px-6 py-3 font-bold">
                Inactive
            </th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="chartClass : ${chartClasses}">
            <td class="px-6 py-4" th:text="${chartClass.className}"></td>
            <td class="px-6 py-4" th:text="${chartClass.classCode}"></td>
            <td class="px-6 py-4" th:text="${chartClass.classType}"></td>
            <td class="px-6 py-4" th:text="${chartClass.inactive}"></td>
            <td>
                <a class="px-2" th:href="@{|/chart-class/update/${chartClass.oid}|}">Edit</a>
                <a class="px-2" th:href="@{|/chart-class/delete/${chartClass.oid}|}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
